[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-rtoken"
version = "0.1.0"
description = "Autonomous Event-Driven Trading Sentinel pairing Qwen event analysis with deterministic risk controls and Bitget paper trading."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aegis Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -p no:gltest -p no:gltest_cli"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src",
]
